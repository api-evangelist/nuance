aid: nuance
name: Nuance
description: >-
  Nuance Communications (NASDAQ: NUAN) is a conversational-AI and
  speech-recognition pioneer, acquired by Microsoft in 2022. Its self-service
  developer platform, Nuance Mix, provides tooling and runtime services for
  building conversational applications: Automatic Speech Recognition (ASRaaS),
  Natural Language Understanding (NLUaaS), Dialog management (DLGaaS),
  Text-to-Speech (TTSaaS) and grammar-based recognition (NRaaS) — all exposed as
  gRPC/protobuf runtime services secured with OAuth 2.0 client-credentials.
  Design-time tooling (Mix.nlu, Mix.dialog) and a first-party CLI (@nuance-mix/mix-cli)
  round out the platform. Nuance also ships Dragon speech solutions, including
  Dragon Medical SpeechKit for healthcare voice capture.
